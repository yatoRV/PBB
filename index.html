<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- Content-Security-Policy (GitHub Pages cannot send headers): only this site, the exact pinned jsDelivr packages
       (onnxruntime-web 1.23.2 / 1.18.0 incl. their .wasm, Ogg decoder 0.1.20), Google sign-in (accounts.google.com/gsi),
       the Google APIs (Drive, userinfo) and oauth2.googleapis.com/revoke (used inside Google's library on sign-out).
       No inline script. A new CDN package/version must be added here.
       'wasm-unsafe-eval' lets the OCR models and the Ogg decoder compile WebAssembly; 'unsafe-eval' is kept only
       because Safari before 16 (iOS 15) knows no 'wasm-unsafe-eval' and blocks WebAssembly without it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/ https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/ https://cdn.jsdelivr.net/npm/@wasm-audio-decoders/ogg-vorbis@0.1.20/ https://accounts.google.com/gsi/client 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com/revoke https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/ https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/ https://cdn.jsdelivr.net/npm/@wasm-audio-decoders/ogg-vorbis@0.1.20/ https://accounts.google.com/gsi/; img-src 'self' blob: data:; media-src 'self' blob: data:; style-src 'self' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lịch đi làm</title>
  <meta name="application-name" content="Lịch đi làm">
  <meta name="apple-mobile-web-app-title" content="Lịch đi làm">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#101522" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fc" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="app.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="boot" class="screen loading" aria-live="polite">
    <p class="loading__text">Đang tải…</p>
  </div>

  <main id="signin" class="screen signin" hidden>
    <img class="signin__icon" src="assets/icons/icon-192.webp" srcset="assets/icons/icon-192.webp 1x, assets/icons/icon-312.webp 3x" fetchpriority="high" alt="" width="104" height="104">
    <h1 class="signin__title">Lịch đi làm</h1>
    <button id="signin-button" class="signin__button" type="button" disabled>
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Đăng nhập bằng Google</span>
    </button>
    <p id="signin-error" class="signin__error" role="alert"></p>
  </main>

  <div id="app" hidden></div>
</body>
</html>
